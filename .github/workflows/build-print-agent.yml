name: Build & Release HuskyPrintAgent

on:
  push:
    tags: ["print-agent-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-agent-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: print-agent-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable (PyInstaller)
        run: pyinstaller --onefile --noconsole --name HuskyPrintAgent agent.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuskyPrintAgent
          path: print-agent-py/dist/HuskyPrintAgent.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: print-agent-py/dist/HuskyPrintAgent.exe
          generate_release_notes: true
          draft: false
          prerelease: false
